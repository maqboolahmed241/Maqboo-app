name: Build Dukaan Hisab APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Prepare project files from ZIP if needed
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f settings.gradle ] || [ ! -d app ]; then
            ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Android project files are missing. Upload Dukaan_Hisab_V14_GitHub_Build_FIXED.zip to the repository root, then run this workflow again."
              exit 1
            fi
            mkdir -p /tmp/dukaan-project
            unzip -q "$ZIP_FILE" -d /tmp/dukaan-project
            if [ -f /tmp/dukaan-project/settings.gradle ]; then
              cp -a /tmp/dukaan-project/. .
            else
              PROJECT_DIR="$(find /tmp/dukaan-project -mindepth 1 -maxdepth 3 -type f -name settings.gradle -printf '%h\\n' | head -n 1)"
              if [ -z "$PROJECT_DIR" ]; then
                echo "ERROR: ZIP does not contain settings.gradle."
                exit 1
              fi
              cp -a "$PROJECT_DIR/." .
            fi
          fi
          test -f settings.gradle
          test -f build.gradle
          test -d app
          test -f app/build.gradle
          test -f app/src/main/assets/index.html

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dukaan-Hisab-V14-APK
          path: app/build/outputs/apk/debug/app-debug.apk
